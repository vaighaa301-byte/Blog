{% extends "base.html" %}

{% block title %}Delete post | Simple Blog{% endblock %}

{% block content %}
<section class="form-card">
    <h1>Delete this post?</h1>
    <p>Are you sure you want to delete <strong>{{ post.title }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button class="button button-danger" type="submit">Yes, delete post</button>
            <a class="button button-secondary" href="{{ post.get_absolute_url }}">Keep post</a>
        </div>
    </form>
</section>
{% endblock %}
