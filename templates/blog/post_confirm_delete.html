{% extends "base.html" %}

{% block title %}Delete post | Simple Blog{% endblock %}

{% block content %}
    <h1>Delete post</h1>
    <p>This action cannot be undone. Are you sure you want to delete <strong>{{ post.title }}</strong>?</p>
    <form method="post" class="form-card">
        {% csrf_token %}
        <button class="button danger" type="submit">Yes, delete</button>
        <a href="{% url 'post_detail' post.pk %}">Cancel</a>
    </form>
{% endblock %}
